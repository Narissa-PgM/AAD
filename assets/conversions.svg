@media (prefers-reduced-motion:reduce){.fade{animation:none;opacity:1}*{animation:none!important}}</style><rect x=".5" y=".5" width="999" height="249" rx="14" fill="#FFFFFF" stroke="#E1E5EA"/><g fill="#13171C"><text x="40" y="38" class="serif" font-size="19" font-weight="700">Three platform conversions, hands-on</text><text x="960" y="38" text-anchor="end" font-size="12.5" class="mut">Inventory → clean → convert → reconcile + parallel-run → cut over, train, retire</text><g class="fade" style="--d:0.10s"><rect x="40.0" y="58" width="298.6666666666667" height="170" rx="12" fill="#FAFBFC" stroke="#E1E5EA"/><rect x="40.0" y="58" width="5" height="170" rx="2" fill="#A51C30"/><text x="58.0" y="84" font-size="13" font-weight="700">Harvard FAS Office for Faculty Affairs</text><text x="58.0" y="102" font-size="11.5" class="mut">2019–2025 · reporting platform</text><rect x="58.0" y="116" width="49.6" height="28" rx="14" fill="#EEF1F4"/><text x="67.0" y="135" font-size="12.5" font-weight="700" class="mut">APEX</text><text x="119.6" y="136" font-size="16" fill="#A51C30" font-weight="700">→</text><rect x="141.6" y="116" width="49.6" height="28" rx="14" fill="#A51C30"/><text x="150.6" y="135" font-size="12.5" font-weight="700" fill="#fff">HART</text><text x="58.0" y="170" font-size="12">Ad-hoc pulls in SQL, Python, R and Crystal</text><text x="58.0" y="187" font-size="12">Reports → HART (Oracle BI) self-service for</text><text x="58.0" y="204" font-size="12">deans, chairs and administrators</text></g><g class="fade" style="--d:0.25s"><rect x="350.6666666666667" y="58" width="298.6666666666667" height="170" rx="12" fill="#FAFBFC" stroke="#E1E5EA"/><rect x="350.6666666666667" y="58" width="5" height="170" rx="2" fill="#85611F"/><text x="368.6666666666667" y="84" font-size="13" font-weight="700">Phillips Academy · Academy Resources</text><text x="368.6666666666667" y="102" font-size="11.5" class="mut">2016–2019 · data platform + reporting</text><rect x="368.6666666666667" y="116" width="120.7" height="28" rx="14" fill="#EEF1F4"/><text x="377.6666666666667" y="135" font-size="12.5" font-weight="700" class="mut">Raiser’s Edge</text><text x="501.3666666666667" y="136" font-size="16" fill="#85611F" font-weight="700">→</text><rect x="523.3666666666667" y="116" width="65.4" height="28" rx="14" fill="#85611F"/><text x="532.3666666666667" y="135" font-size="12.5" font-weight="700" fill="#fff">Agilon</text><text x="368.6666666666667" y="170" font-size="12">Paper records digitized, 10 years back-entered;</text><text x="368.6666666666667" y="187" font-size="12">campaign reporting tied to the General Ledger</text></g><g class="fade" style="--d:0.40s"><rect x="661.3333333333334" y="58" width="298.6666666666667" height="170" rx="12" fill="#FAFBFC" stroke="#E1E5EA"/><rect x="661.3333333333334" y="58" width="5" height="170" rx="2" fill="#2F6B4F"/><text x="679.3333333333334" y="84" font-size="13" font-weight="700">UAMS Institutional Advancement</text><text x="679.3333333333334" y="102" font-size="11.5" class="mut">2008–2016 · data platform + reporting</text><rect x="679.3333333333334" y="116" width="120.7" height="28" rx="14" fill="#EEF1F4"/><text x="688.3333333333334" y="135" font-size="12.5" font-weight="700" class="mut">Raiser’s Edge</text><text x="812.0333333333334" y="136" font-size="16" fill="#2F6B4F" font-weight="700">→</text><rect x="834.0333333333334" y="116" width="73.30000000000001" height="28" rx="14" fill="#2F6B4F"/><text x="843.0333333333334" y="135" font-size="12.5" font-weight="700" fill="#fff">Advance</text><text x="679.3333333333334" y="170" font-size="12">SunGard (now Ellucian) Advance for two</text><text x="679.3333333333334" y="187" font-size="12">foundations; 10 years back-entered; online</text><text x="679.3333333333334" y="204" font-size="12">giving piloted; monthly ledger tie-outs</text></g></g></svg>