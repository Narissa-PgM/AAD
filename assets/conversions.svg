<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250" role="img" aria-label="Three platform conversions: APEX to HART at Harvard FAS; Raiser’s Edge to Agilon at Phillips Academy; Raiser’s Edge to SunGard Advance at UAMS."><title>Three platform conversions: APEX to HART at Harvard FAS; Raiser’s Edge to Agilon at Phillips Academy; Raiser’s Edge to SunGard Advance at UAMS.</title><style>text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif}.serif{font-family:Cambria,Georgia,'Times New Roman',serif}.mut{fill:#5C6774}
