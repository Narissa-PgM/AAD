<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" width="1672" height="941" role="img" aria-labelledby="impactTitle impactDesc">
<title id="impactTitle">The Impact Circle Stewardship Reporting</title>
<desc id="impactDesc">A proposed One Harvard continuous stewardship model. Seven linked stages around a central mission: plan and prioritize, prepare and gather, produce and personalize, review and certify, deliver and engage, evaluate and learn, improve and scale. Coordination does not imply formal authority over Harvard units.</desc>
<defs>
 <marker id="arrow" markerWidth="7" markerHeight="7" refX="4" refY="3.5" orient="auto"><path d="M 0 0 L 7 3.5 L 0 7 Z" fill="#A6B6C1"/></marker>
 <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#173047" flood-opacity=".10"/></filter>
 <linearGradient id="background" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F3F7FA"/></linearGradient>
</defs>
