<text x="836" y="449" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" letter-spacing="4" fill="#9E2B42" text-anchor="middle">ONE HARVARD</text>
<text x="836" y="493" font-family="Cambria,Georgia,serif" font-size="36" font-weight="700" fill="#233C53" text-anchor="middle">Shared purpose</text>
<text x="836" y="526" font-family="Cambria,Georgia,serif" font-size="28" fill="#365871" text-anchor="middle">Local accountability</text>
