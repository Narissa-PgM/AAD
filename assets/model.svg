@media (prefers-reduced-motion:reduce){.fade{animation:none;opacity:1}*{animation:none!important}}</style><rect x=".5" y=".5" width="999" height="269" rx="14" fill="#FFFFFF" stroke="#E1E5EA"/><g fill="#13171C"><text x="40" y="38" class="serif" font-size="19" font-weight="700">One operating model, every page</text><text x="960" y="38" text-anchor="end" font-size="12.5" class="mut">VERITAS here is a proposed editorial mnemonic, not an expansion of the University motto</text><g class="fade" style="--d:0.10s"><rect x="40.0" y="58" width="204.5" height="190" rx="12" fill="#FAFBFC" stroke="#E1E5EA"/><rect x="40.0" y="58" width="204.5" height="6" rx="3" fill="#2F6B4F"/><text x="56.0" y="92" font-size="11" font-weight="700" fill="#2F6B4F" letter-spacing="1.4">WHO</text><text x="56.0" y="118" class="serif" font-size="20" font-weight="700">One Harvard</text><text x="56.0" y="140" font-size="11.5" class="mut">Leading across offices</text><text x="56.0" y="172" font-size="12">8 partner offices</text><text x="56.0" y="192" font-size="12">shared automation + standards</text><text x="56.0" y="212" font-size="12">each office keeps its decisions</text></g><text x="261.5" y="158" text-anchor="middle" font-size="22" fill="#9AA3AC">→</text><g class="fade" style="--d:0.28s"><rect x="278.5" y="58" width="204.5" height="190" rx="12" fill="#FAFBFC" stroke="#E1E5EA"/><rect x="278.5" y="58" width="204.5" height="6" rx="3" fill="#2D6E73"/><text x="294.5" y="92" font-size="11" font-weight="700" fill="#2D6E73" letter-spacing="1.4">WHEN</text><text x="294.5" y="118" class="serif" font-size="20" font-weight="700">Impact Circle</text><text x="294.5" y="140" font-size="11.5" class="mut">Seven stages a year</text><text x="294.5" y="172" font-size="12">Plan · Prepare · Produce</text><text x="294.5" y="192" font-size="12">Review &amp; Certify · Deliver</text><text x="294.5" y="212" font-size="12">Evaluate &amp; Learn · Improve</text></g><text x="500.0" y="158" text-anchor="middle" font-size="22" fill="#9AA3AC">→</text><g class="fade" style="--d:0.46s"><rect x="517.0" y="58" width="204.5" height="190" rx="12" fill="#FAFBFC" stroke="#E1E5EA"/><rect x="517.0" y="58" width="204.5" height="6" rx="3" fill="#2B5C8A"/><text x="533.0" y="92" font-size="11" font-weight="700" fill="#2B5C8A" letter-spacing="1.4">HOW</text><text x="533.0" y="118" class="serif" font-size="20" font-weight="700">SMARTER</text><text x="533.0" y="140" font-size="11.5" class="mut">One gate per stage</text><text x="533.0" y="172" font-size="12" font-weight="700" letter-spacing="3" fill="#2B5C8A">S M A R T E R</text><text x="533.0" y="192" font-size="12">Release Gate at Review &amp; Certify:</text><text x="533.0" y="212" font-size="12">6 checks before anything ships</text></g><text x="738.5" y="158" text-anchor="middle" font-size="22" fill="#9AA3AC">→</text><g class="fade" style="--d:0.64s"><rect x="755.5" y="58" width="204.5" height="190" rx="12" fill="#FAFBFC" stroke="#E1E5EA"/><rect x="755.5" y="58" width="204.5" height="6" rx="3" fill="#A51C30"/><text x="771.5" y="92" font-size="11" font-weight="700" fill="#A51C30" letter-spacing="1.4">WHAT</text><text x="771.5" y="118" class="serif" font-size="20" font-weight="700">VERITAS</text><text x="771.5" y="140" font-size="11.5" class="mut">Seven report questions</text><text x="771.5" y="172" font-size="12">Vision · Experience · Results</text><text x="771.5" y="192" font-size="12">Investment · Truth</text><text x="771.5" y="212" font-size="12">Advancement · Stewardship</text></g></g></svg>