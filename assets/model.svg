<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 270" width="1000" height="270" role="img" aria-label="One operating model: One Harvard (who), Impact Circle (when), SMARTER with the six-check Release Gate (how), VERITAS (what)."><title>One operating model: One Harvard (who), Impact Circle (when), SMARTER with the six-check Release Gate (how), VERITAS (what).</title><style>text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif}.serif{font-family:Cambria,Georgia,'Times New Roman',serif}.mut{fill:#5C6774}
