<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 190" width="1000" height="190" role="img" aria-label="Annual ad-hoc reporting requests fell from 300–400 a year to under 100 after self-service dashboards: a 67–75% reduction."><title>Annual ad-hoc reporting requests fell from 300–400 a year to under 100 after self-service dashboards: a 67–75% reduction.</title><style>text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif}.serif{font-family:Cambria,Georgia,'Times New Roman',serif}.mut{fill:#5C6774}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.fade{}
@media (prefers-reduced-motion:reduce){.fade{animation:none;opacity:1}*{animation:none!important}}</style><rect x=".5" y=".5" width="999" height="189" rx="14" fill="#FFFFFF" stroke="#E1E5EA"/><g fill="#13171C"><text x="40" y="38" class="serif" font-size="19" font-weight="700">Fewer one-off requests, more reusable reporting</text><text x="960" y="38" text-anchor="end" font-size="12.5" class="mut">Annual ad-hoc requests, FAS Faculty Affairs</text><text x="40" y="84" font-size="13" font-weight="700">Before dashboards</text><text x="40" y="100" font-size="11" class="mut">300–400 a year</text><rect x="230" y="70" width="495.0" height="30" rx="6" fill="#B9C2CC" class="fade" style="--d:.1s"/><rect x="725.0" y="70" width="165.0" height="30" rx="6" fill="#B9C2CC" fill-opacity=".45" stroke="#9AA3AC" stroke-dasharray="4 3" class="fade" style="--d:.2s"/><text x="900.0" y="90" font-size="12" class="mut">range</text><text x="40" y="134" font-size="13" font-weight="700">After self-service</text><text x="40" y="150" font-size="11" class="mut">under 100 a year</text><rect x="230" y="120" width="165.0" height="30" rx="6" fill="#A51C30" class="fade" style="--d:.4s"/><text x="409.0" y="141" class="serif" font-size="22" font-weight="700" fill="#A51C30">67–75% fewer</text><text x="40" y="176" font-size="11" class="mut">At least 67% if the earlier year was 300, 75% if it was 400.</text></g></svg>