<g class="oh-nd oh-step" aria-label="Step 6: Draft · Automation" style="--c:#2F6B4F;--d:810ms"><rect x="764" y="225.0" width="100" height="66" rx="10"/><circle cx="778" cy="225.0" r="11" fill="#2F6B4F" stroke="#fff" stroke-width="2"/><text x="778" y="229.5" text-anchor="middle" class="num">6</text><text x="814.0" y="251.0" text-anchor="middle" class="t">Draft</text><text x="814.0" y="267.0" text-anchor="middle" class="s">approved rows</text><text x="814.0" y="282.0" text-anchor="middle" class="a" fill="#2F6B4F">Automation</text></g>
<g class="oh-nd oh-step" aria-label="Step 7: Release Gate · People" style="--c:#A51C30;--d:920ms"><rect x="874" y="425.0" width="100" height="66" rx="10"/><circle cx="888" cy="425.0" r="11" fill="#A51C30" stroke="#fff" stroke-width="2"/><text x="888" y="429.5" text-anchor="middle" class="num">7</text><text x="924.0" y="451.0" text-anchor="middle" class="t sm">Release Gate</text><text x="924.0" y="467.0" text-anchor="middle" class="s">6 checks · signed</text><text x="924.0" y="482.0" text-anchor="middle" class="a" fill="#A51C30">People</text></g>
<g class="oh-nd oh-step" aria-label="Step 8: Send + log · Automation" style="--c:#2F6B4F;--d:1030ms"><rect x="984" y="101.0" width="100" height="66" rx="10"/><circle cx="998" cy="101.0" r="11" fill="#2F6B4F" stroke="#fff" stroke-width="2"/><text x="998" y="105.5" text-anchor="middle" class="num">8</text><text x="1034.0" y="127.0" text-anchor="middle" class="t">Send + log</text><text x="1034.0" y="143.0" text-anchor="middle" class="s">lock the cycle</text><text x="1034.0" y="158.0" text-anchor="middle" class="a" fill="#2F6B4F">Automation</text></g>
</svg>