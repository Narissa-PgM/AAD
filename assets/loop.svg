<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="516" viewBox="0 0 1240 516" role="img" aria-label="The reporting loop on one page: data from five sources flows through eight steps in four lanes, then out to donors, the send log and season measures. Green steps are automation; red steps are people. Animated.">
<style>text{font-family:Cambria,Georgia,'Times New Roman',serif}.lane{font:700 13px system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif}.lsub{font:12px system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;fill:#6E7780}.sn{font:700 12.5px system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;fill:#13171C}.ss{font:11px system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;fill:#6E7780}
.lt{font:700 12px system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;fill:#6B4E14}.note{font-size:12.5px;font-style:italic;fill:#6E7780}
.oh-nd rect{fill:#fff;stroke:var(--c);stroke-width:2}.oh-learn rect{fill:#FBF5EA}.num{font:700 13px system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;fill:#fff}.t{font-size:14.5px;font-weight:700;fill:#13171C}.t.sm{font-size:12.5px}.s{font-size:11px;fill:#5C6774}.a{font:700 11px system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
.oh-flow{fill:none;stroke-width:1.8;stroke-opacity:.75;stroke-dasharray:5 7;animation:d 1.3s linear infinite}.oh-con{stroke-width:2.2;stroke-opacity:.85}.oh-back{stroke-width:2;stroke-dasharray:7 6}
@keyframes d{to{stroke-dashoffset:-24}}

@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}.oh-pip,.oh-tokens{display:none}}</style>
<rect x="0" y="0" width="1240" height="516" rx="14" fill="#fff"/><defs><marker id="ohAr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E7780"/></marker><radialGradient id="ohTok"><stop offset="0" stop-color="#fff"/><stop offset=".45" stop-color="#E9C98B"/><stop offset="1" stop-color="#8A651F"/></radialGradient>
<path id="ohRoute" d="M264.0,134.0 C324.5,134.0 313.5,134.0 374.0,134.0 C434.5,134.0 423.5,258.0 484.0,258.0 C544.5,258.0 533.5,358.0 594.0,358.0 C654.5,358.0 643.5,258.0 704.0,258.0 C764.5,258.0 753.5,258.0 814.0,258.0 C874.5,258.0 863.5,458.0 924.0,458.0 C984.5,458.0 973.5,134.0 1034.0,134.0"/></defs>
<g class="oh-lane" style="--d:0ms"><rect x="0" y="64" width="1240" height="140" rx="12" fill="#2F6B4F" fill-opacity=".055"/>
<text x="14" y="84" class="lane" fill="#2F6B4F">Systems</text><text x="76" y="84" class="lsub">scheduled · read-only</text>
</g>
<g class="oh-lane" style="--d:60ms"><rect x="0" y="212" width="1240" height="92" rx="12" fill="#A51C30" fill-opacity=".055"/>
<text x="14" y="255.0" class="lane" fill="#A51C30">Reporting team</text><text x="14" y="272.0" class="lsub">led by the Director</text>
</g>
<g class="oh-lane" style="--d:120ms"><rect x="0" y="312" width="1240" height="92" rx="12" fill="#A51C30" fill-opacity=".055"/>
<text x="14" y="355.0" class="lane" fill="#A51C30">Review team</text><text x="14" y="372.0" class="lsub">exceptions only</text>
</g>
