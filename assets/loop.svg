<g class="oh-nd oh-step" aria-label="Step 2: Match &amp; flag · Automation" style="--c:#2F6B4F;--d:370ms"><rect x="324" y="101.0" width="100" height="66" rx="10"/><circle cx="338" cy="101.0" r="11" fill="#2F6B4F" stroke="#fff" stroke-width="2"/><text x="338" y="105.5" text-anchor="middle" class="num">2</text><text x="374.0" y="127.0" text-anchor="middle" class="t sm">Match &amp; flag</text><text x="374.0" y="143.0" text-anchor="middle" class="s">ledger + flags</text><text x="374.0" y="158.0" text-anchor="middle" class="a" fill="#2F6B4F">Automation</text></g>
