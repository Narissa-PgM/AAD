<text x="14" y="455.0" class="lane" fill="#A51C30">Gift officer + approver</text><text x="14" y="472.0" class="lsub">Release Gate</text>
</g>
<g class="oh-src" style="--d:120ms"><circle cx="20" cy="94" r="4.5" fill="#A51C30"/><text x="31" y="98" class="sn">Advance<title>Advance · gifts · funds</title></text><path id="ohS0" class="oh-flow" d="M150,94 C182,94 178,115.0 212,115.0" stroke="#A51C30"/><circle r="2.8" fill="#A51C30" class="oh-pip"><animateMotion dur="2.2s" begin="0.0s" repeatCount="indefinite"><mpath href="#ohS0"/></animateMotion></circle></g>
