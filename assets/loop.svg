<g class="oh-nd oh-step" aria-label="Step 4: Cross-check · People" style="--c:#A51C30;--d:590ms"><rect x="544" y="325.0" width="100" height="66" rx="10"/><circle cx="558" cy="325.0" r="11" fill="#A51C30" stroke="#fff" stroke-width="2"/><text x="558" y="329.5" text-anchor="middle" class="num">4</text><text x="594.0" y="351.0" text-anchor="middle" class="t sm">Cross-check</text><text x="594.0" y="367.0" text-anchor="middle" class="s">exceptions only</text><text x="594.0" y="382.0" text-anchor="middle" class="a" fill="#A51C30">People</text></g>
