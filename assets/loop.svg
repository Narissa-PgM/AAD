<g class="oh-out" style="--d:1280ms"><path id="ohO2" class="oh-flow" d="M1084,149.0 C1114,149.0 1054,164 1084,164" stroke="#2F6B4F"/><circle r="2.8" fill="#2F6B4F" class="oh-pip"><animateMotion dur="3.0s" begin="-1.2s" repeatCount="indefinite"><mpath href="#ohO2"/></animateMotion></circle><rect x="1086" y="149" width="146" height="32" rx="8" fill="#fff" stroke="#D5DBE1"/><circle cx="1098" cy="165" r="4" fill="#2F6B4F"/><text x="1108" y="163" class="sn">Season measures</text><text x="1108" y="175" class="ss">on time · corrections</text></g>
