<g class="oh-src" style="--d:260ms"><circle cx="20" cy="136" r="4.5" fill="#2B5C8A"/><text x="31" y="140" class="sn">Financial Aid<title>Financial Aid · recipients</title></text><path id="ohS2" class="oh-flow" d="M150,136 C182,136 178,134.0 212,134.0" stroke="#2B5C8A"/><circle r="2.8" fill="#2B5C8A" class="oh-pip"><animateMotion dur="2.8s" begin="-1.0s" repeatCount="indefinite"><mpath href="#ohS2"/></animateMotion></circle></g>
<g class="oh-src" style="--d:330ms"><circle cx="20" cy="157" r="4.5" fill="#5B4A8A"/><text x="31" y="161" class="sn">GSAS<title>GSAS · fellows</title></text><path id="ohS3" class="oh-flow" d="M150,157 C182,157 178,143.5 212,143.5" stroke="#5B4A8A"/><circle r="2.8" fill="#5B4A8A" class="oh-pip"><animateMotion dur="3.1s" begin="-1.5s" repeatCount="indefinite"><mpath href="#ohS3"/></animateMotion></circle></g>
<g class="oh-src" style="--d:400ms"><circle cx="20" cy="178" r="4.5" fill="#2F6B4F"/><text x="31" y="182" class="sn">Faculty Affairs<title>Faculty Affairs · chair holders</title></text><path id="ohS4" class="oh-flow" d="M150,178 C182,178 178,153.0 212,153.0" stroke="#2F6B4F"/><circle r="2.8" fill="#2F6B4F" class="oh-pip"><animateMotion dur="3.4s" begin="-2.0s" repeatCount="indefinite"><mpath href="#ohS4"/></animateMotion></circle></g>
