name: Model consistency
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Every live page uses One Harvard → Impact Circle → SMARTER → VERITAS
        run: python3 tools/check_models.py
